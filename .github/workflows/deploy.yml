name: Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: 打包代码
        run: |
          tar -czf deploy.tar.gz --exclude=venv --exclude=.git --exclude=db.sqlite3 --exclude=__pycache__ --exclude=.github .
      
      - name: 部署到 PythonAnywhere
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          server-dir: /home/lzysxfcs/my_blog/
