<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ article.title }} - 阿宇的技术博客</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f7fa;
            color: #1a202c;
            line-height: 1.8;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }
        .header h1 a {
            color: white;
            text-decoration: none;
        }
        .header h1 a:hover {
            opacity: 0.9;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .article-card {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .article-title {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #1a202c;
        }
        .article-meta {
            color: #718096;
            font-size: 0.9rem;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            gap: 20px;
        }
        .article-meta .date::before {
            content: "📅 ";
        }
	/* 新增：浏览人数样式 */
	.article-meta .views {
	    margin-left: 16px;
	}
        .article-content {
            font-size: 1.05rem;
            color: #2d3748;
        }
        .article-content p {
            margin-bottom: 1.2em;
        }
        .article-content h1 {
            font-size: 1.8rem;
            margin: 1.5rem 0 1rem;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 0.5rem;
        }
        .article-content h2 {
            font-size: 1.5rem;
            margin: 1.2rem 0 0.8rem;
        }
        .article-content h3 {
            font-size: 1.25rem;
            margin: 1rem 0 0.5rem;
        }
        .article-content ul, .article-content ol {
            margin: 0.5rem 0 0.5rem 2rem;
        }
        .article-content li {
            margin: 0.25rem 0;
        }
        .article-content table {
            border-collapse: collapse;
            width: 100%;
            margin: 1rem 0;
        }
        .article-content th, .article-content td {
            border: 1px solid #cbd5e0;
            padding: 8px 12px;
            text-align: left;
        }
        .article-content th {
            background: #f7fafc;
            font-weight: 600;
        }
        .article-content pre {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 20px 0;
            font-size: 0.9rem;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
        }
        .article-content code {
            background: #edf2f7;
            color: #1a202c;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 0.9rem;
        }
        .article-content pre code {
            background: transparent;
            color: #d4d4d4;
            padding: 0;
            font-size: inherit;
        }
        .back-link {
            margin-top: 40px;
            text-align: center;
        }
        .back-link a {
            color: #667eea;
            text-decoration: none;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
        footer {
            text-align: center;
            padding: 30px 20px;
            color: #718096;
            font-size: 0.8rem;
            border-top: 1px solid #e2e8f0;
            margin-top: 40px;
        }
        @media (max-width: 600px) {
            .article-title { font-size: 1.5rem; }
            .article-card { padding: 24px; }
            .container { padding: 20px 16px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1><a href="/">阿宇的技术博客</a></h1>
    </div>
    <div class="container">
        <div class="article-card">
            <h1 class="article-title">{{ article.title }}</h1>
            <div class="article-meta">
                <span class="date">{{ article.created_time|date:"Y年m月d日" }}</span>
		<span class="views">👁️ {{ article.total_views }} 次阅读</span>
            </div>
            <div class="article-content">
                {{ article.content|safe }}
            </div>
            <div class="back-link">
                <a href="/">← 返回首页</a>
            </div>
        </div>
    </div>
    <footer>
        <p>© 2025 阿宇的技术博客 | 用 Django 搭建</p>
    </footer>
</body>
</html>
