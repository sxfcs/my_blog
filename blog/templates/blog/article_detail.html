<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ article.title }} - 阿宇的技术博客</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f5f7fa;
            color: #1a202c;
            line-height: 1.8;
        }
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }
        .header h1 a {
            color: white;
            text-decoration: none;
        }
        .header h1 a:hover {
            opacity: 0.9;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        .article-card {
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .article-title {
            font-size: 2rem;
            margin-bottom: 20px;
            color: #1a202c;
        }
        .article-meta {
            color: #718096;
            font-size: 0.9rem;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #e2e8f0;
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        .article-meta .date::before {
            content: "📅 ";
        }
        .article-meta .views {
            margin-left: 0;
        }
        /* 分类链接样式 */
        .article-meta .category a {
            color: #718096;
            text-decoration: none;
        }
        .article-meta .category a:hover {
            color: #667eea;
            text-decoration: underline;
        }
        .article-content {
            font-size: 1.05rem;
            color: #2d3748;
	     white-space: pre-wrap;  /* 添加这一行：保留换行符和空格 */
        }
        .article-content p {
            margin-bottom: 1.2em;
        }
        .article-content h1 {
            font-size: 1.8rem;
            margin: 1.5rem 0 1rem;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 0.5rem;
        }
        .article-content h2 {
            font-size: 1.5rem;
            margin: 1.2rem 0 0.8rem;
        }
        .article-content h3 {
            font-size: 1.25rem;
            margin: 1rem 0 0.5rem;
        }
        .article-content ul, .article-content ol {
            margin: 0.5rem 0 0.5rem 2rem;
        }
        .article-content li {
            margin: 0.25rem 0;
        }
        .article-content table {
            border-collapse: collapse;
            width: 100%;
            margin: 1rem 0;
        }
        .article-content th, .article-content td {
            border: 1px solid #cbd5e0;
            padding: 8px 12px;
            text-align: left;
        }
        .article-content th {
            background: #f7fafc;
            font-weight: 600;
        }
        .article-content pre {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 16px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 20px 0;
            font-size: 0.9rem;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
        }
        .article-content code {
            background: #edf2f7;
            color: #1a202c;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 0.9rem;
        }
        .article-content pre code {
            background: transparent;
            color: #d4d4d4;
            padding: 0;
            font-size: inherit;
        }
        /* 评论区域样式 */
        .comment-section {
            margin-top: 40px;
            padding-top: 30px;
            border-top: 2px solid #e2e8f0;
        }

        /* ========== 自定义评论样式 ========== */
        /* 评论卡片 */
        .comment-section .comment-card {
            background: #f8fafc;
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            transition: all 0.2s;
        }
        /* 评论头部 */
        .comment-section .comment-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        /* 用户头像 */
        .comment-section .comment-avatar {
            width: 40px;
            height: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1.1rem;
        }
        /* 用户信息 */
        .comment-section .comment-info {
            flex: 1;
        }
        .comment-section .comment-author {
            font-weight: 700;
            color: #1a202c;
            font-size: 1rem;
        }
        .comment-section .comment-date {
            font-size: 0.75rem;
            color: #a0aec0;
            margin-top: 2px;
        }
        /* 评论内容 */
        .comment-section .comment-body {
            color: #2d3748;
            line-height: 1.6;
            font-size: 0.95rem;
            margin-left: 52px;
            margin-bottom: 12px;
        }
        /* 评论按钮组 */
        .comment-section .comment-actions {
            margin-left: 52px;
            display: flex;
            gap: 16px;
        }
        .comment-section .comment-actions button,
        .comment-section .comment-actions a {
            background: transparent;
            border: none;
            color: #667eea;
            font-size: 0.8rem;
            padding: 4px 12px;
            border-radius: 20px;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: background 0.2s;
        }
        .comment-section .comment-actions button:hover,
        .comment-section .comment-actions a:hover {
            background: #e2e8f0;
            color: #5a67d8;
        }
        /* 子评论（回复） */
        .comment-section .replies {
            margin-left: 52px;
            padding-left: 20px;
            border-left: 2px solid #e2e8f0;
            margin-top: 16px;
        }
        /* 评论表单 */
        .comment-section .comment-form {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 20px;
            padding: 20px;
            margin-top: 24px;
        }
        .comment-section .comment-form textarea {
            width: 100%;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 12px 16px;
            font-size: 0.9rem;
            font-family: inherit;
            resize: vertical;
            transition: all 0.2s;
        }
        .comment-section .comment-form textarea:focus {
            border-color: #667eea;
            outline: none;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        /* 提交按钮 */
        .comment-section .comment-form button[type="submit"] {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 30px;
            padding: 10px 28px;
            color: white;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            margin-top: 12px;
            transition: opacity 0.2s;
        }
        .comment-section .comment-form button[type="submit"]:hover {
            opacity: 0.9;
        }
        /* 评论计数 */
        .comment-section .comment-count {
            font-size: 1.1rem;
            font-weight: 600;
            color: #1a202c;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 2px solid #e2e8f0;
        }
        /* 响应式 */
        @media (max-width: 600px) {
            .comment-section .comment-body,
            .comment-section .comment-actions,
            .comment-section .replies {
                margin-left: 0;
            }
            .comment-section .replies {
                margin-left: 16px;
                padding-left: 12px;
            }
        }
        /* ========== 自定义评论样式结束 ========== */

        .back-link {
            margin-top: 40px;
            text-align: center;
        }
        .back-link a {
            color: #667eea;
            text-decoration: none;
        }
        .back-link a:hover {
            text-decoration: underline;
        }
        footer {
            text-align: center;
            padding: 30px 20px;
            color: #718096;
            font-size: 0.8rem;
            border-top: 1px solid #e2e8f0;
            margin-top: 40px;
        }
        @media (max-width: 600px) {
            .article-title { font-size: 1.5rem; }
            .article-card { padding: 24px; }
            .container { padding: 20px 16px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1><a href="/">阿宇的技术博客</a></h1>
    </div>
    <div class="container">
        <div class="article-card">
            <h1 class="article-title">{{ article.title }}</h1>
            <div class="article-meta">
                <span class="date">{{ article.created_time|date:"Y年m月d日" }}</span>
                <span class="views">👁️ {{ article.total_views }} 次阅读</span>
                {% if article.category %}
                <span class="category">📁 <a href="?category={{ article.category.slug }}">{{ article.category.name }}</a></span>
                {% endif %}
            </div>
            <div class="article-content">
                {{ article.content|safe }}
            </div>
            
            <!-- 评论区域 -->
            <div class="comment-section">
                {% load comment_tags %}
                {% render_comments article request %}
            </div>
            
            <div class="back-link">
                <a href="/">← 返回首页</a>
            </div>
        </div>
    </div>
    <footer>
        <p>© 2026 阿宇的技术博客 | 用 Django 搭建</p>
    </footer>
</body>
</html>
