{% extends 'blog/base.html' %}

{% block title %}用户登录 - 阿宇的技术博客{% endblock %}

{% block content %}
<div class="login-container">
    <div class="login-card">
        <h1>🔐 用户登录</h1>
        <p class="login-desc">欢迎回来，请登录您的账号</p>
        
        <form method="post" class="login-form">
            {% csrf_token %}
            
            {% if messages %}
                {% for message in messages %}
                <div class="alert alert-error">{{ message }}</div>
                {% endfor %}
            {% endif %}
            
            <div class="form-group">
                <label for="username">用户名</label>
                <input type="text" name="username" id="username" placeholder="请输入用户名" required>
            </div>
            
            <div class="form-group">
                <label for="password">密码</label>
                <input type="password" name="password" id="password" placeholder="请输入密码" required>
            </div>
            
            <button type="submit" class="btn-login">立即登录</button>
        </form>
        
        <div class="login-footer">
            <p>还没有账号？ <a href="{% url 'blog:register' %}">立即注册</a></p>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_css %}
<style>
    .login-container {
        max-width: 500px;
        margin: 0 auto;
        padding: 20px;
    }
    .login-card {
        background: white;
        border-radius: 16px;
        padding: 40px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    .login-card h1 {
        text-align: center;
        margin-bottom: 10px;
    }
    .login-desc {
        text-align: center;
        color: #718096;
        margin-bottom: 30px;
    }
    .form-group {
        margin-bottom: 20px;
    }
    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-weight: 600;
    }
    .form-group input {
        width: 100%;
        padding: 12px 16px;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        font-size: 1rem;
    }
    .btn-login {
        width: 100%;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        padding: 12px;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
    }
    .login-footer {
        text-align: center;
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid #e2e8f0;
    }
    .login-footer a {
        color: #667eea;
        text-decoration: none;
    }
    .alert-error {
        background: #fed7d7;
        color: #742a2a;
        padding: 10px;
        border-radius: 8px;
        margin-bottom: 20px;
    }
</style>
{% endblock %}
